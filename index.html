    <style>
      /* Critical inline CSS for instant first paint */
      #root { min-height: 100vh; }
      .app-loading { display:flex; align-items:center; justify-content:center; height:100vh; background:#f8fafc; }
      .app-loading-dark { background:#121214; }
      .app-spinner { width:32px; height:32px; border:3px solid #e2e8f0; border-top-color:#6366f1; border-radius:50%; animation:spin .6s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading" id="initial-loader">
        <div class="app-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
